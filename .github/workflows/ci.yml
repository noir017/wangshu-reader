name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # 依赖 samples/ 本地样书的用例会自动跳过；端到端测试（playwright）不在 CI 里跑
      - run: npx vitest run
      - run: npm run build:all

      - name: Package
        run: |
          mkdir -p artifacts/wangshu-reader-server
          cp dist-single/index.html artifacts/wangshu-reader-single.html
          cp -r dist dist-server package.json package-lock.json artifacts/wangshu-reader-server/

      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/wangshu-reader-single.html
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: wangshu-reader-web
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: wangshu-reader-server
          path: artifacts/wangshu-reader-server/
          if-no-files-found: error

  # Android 包（debug 签名，只供测试；正式包见 release.yml）。runner 自带 Android SDK，node 取自 Termux 仓库
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: android/scripts/build.sh debug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk wangshu-reader-android-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          path: wangshu-reader-android-debug.apk
          archive: false
          if-no-files-found: error
