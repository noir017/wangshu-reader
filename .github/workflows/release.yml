name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # 建 Release、上传附件
    steps:
      - uses: actions/checkout@v7

      # 发版带写权限：按 setup-node 的建议不用依赖缓存
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # APK 的 versionName 取自 package.json，tag 要跟它对上
      - name: Check version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build:all

      # 发版密钥（keystore 的 base64 与口令）在仓库 secrets 里；缺了就失败，不能退回 debug 签名——签名不同的包没法覆盖安装
      - name: Build Android
        env:
          KEYSTORE_BASE64: ${{ secrets.WANGSHU_KEYSTORE_BASE64 }}
          WANGSHU_KEYSTORE_PASSWORD: ${{ secrets.WANGSHU_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$WANGSHU_KEYSTORE_PASSWORD"
          export WANGSHU_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$WANGSHU_KEYSTORE"
          keytool -list -keystore "$WANGSHU_KEYSTORE" -storepass "$WANGSHU_KEYSTORE_PASSWORD" -alias wangshu | grep -i fingerprint
          android/scripts/build.sh release
          rm -f "$WANGSHU_KEYSTORE"

      # 附件名末尾带版本号（tag 名，如 wangshu-reader-android-v0.1.2.apk），下载下来能分清是哪一版；服务端包解压出的目录名不带版本
      - name: Package
        run: |
          V="$GITHUB_REF_NAME"
          mkdir -p release pkg/wangshu-reader-server
          cp dist-single/index.html "release/wangshu-reader-single-$V.html"
          (cd dist && zip -qr "../release/wangshu-reader-web-$V.zip" .)
          cp -r dist dist-server package.json package-lock.json pkg/wangshu-reader-server/
          (cd pkg && zip -qr "../release/wangshu-reader-server-$V.zip" wangshu-reader-server)
          cp android/app/build/outputs/apk/release/app-release.apk "release/wangshu-reader-android-$V.apk"
          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
