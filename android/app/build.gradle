plugins {
    id 'com.android.application'
}

// 版本跟 package.json 走（发版 tag 也是它）：0.1.0 → versionCode 100
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.-')[0..2]*.toInteger()

// 发版签名：CI 从 secrets 还原 keystore 后经环境变量传进来。没有就退回 debug 签名（本地自用）——
// 但两种签名的包不能互相覆盖安装，发出去的包必须用同一把发版密钥
def releaseKeystore = System.getenv('WANGSHU_KEYSTORE')

android {
    namespace 'io.github.noir017.wangshu'
    // arm64 构建机上用的是 Debian 的 aapt2（Android 14），读不了 android-35 的 android.jar，所以停在 34
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.noir017.wangshu'
        minSdk 26
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        // 内置服务端的 node 取自 Termux，只打了 arm64
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('WANGSHU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WANGSHU_KEY_ALIAS') ?: 'wangshu'
                keyPassword System.getenv('WANGSHU_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // node 和依赖库要真正解压到 nativeLibraryDir 才能执行
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    // 默认规则会丢掉 _ 开头的目录和 . 开头的文件，前端产物里可能有
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
